{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Communication_LTD</title>
  <link rel="stylesheet" href="{% static 'css/clean.css' %}">
  <script src="{% static 'js/password_strength.js' %}?v=3" defer></script>
</head>
<body class="auth-page">

  <div class="auth-logo"><a href="/" style="text-decoration:none;color:inherit;">Comm<span>LTD</span></a></div>

  <div class="auth-card">
    <div class="card">
      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Join Communication_LTD's employee portal.</p>

      {% if errors %}
        <div class="alert alert--error" role="alert">
          <ul>
            {% for error in errors %}
              <li>{{ error }}</li>
            {% endfor %}
          </ul>
        </div>
      {% endif %}

      <form method="post" action="{% url 'register' %}">
        {% csrf_token %}

        <div class="field">
          <label class="label" for="username">Username</label>
          <input class="input" type="text" id="username" name="username"
                 placeholder="Choose a username"
                 value="{{ username|default:'' }}" required autocomplete="username">
        </div>

        <div class="field">
          <label class="label" for="email">Email address</label>
          <input class="input" type="email" id="email" name="email"
                 placeholder="you@example.com"
                 value="{{ email|default:'' }}" required autocomplete="email">
        </div>

        <div class="field">
          <label class="label" for="password">Password</label>
          <div class="input-wrap">
            <input class="input" type="password" id="password" name="password"
                   placeholder="Create a strong password" required autocomplete="new-password">
            <button type="button" class="input-toggle" onclick="togglePassword('password')" aria-label="Toggle password visibility">&#128065;</button>
          </div>
          <progress id="password-strength-bar" class="strength-bar" value="0" max="5"></progress>
          <ul id="password-feedback" class="strength-feedback"></ul>
        </div>

        <button type="submit" class="btn btn--primary btn--full">Create Account</button>
      </form>
    </div>

    <p class="auth-footer-text">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
  </div>

  <script>
    function togglePassword(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }
  </script>

</body>
</html>
