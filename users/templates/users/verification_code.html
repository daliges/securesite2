{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Verification Code — Communication_LTD</title>
  <link rel="stylesheet" href="{% static 'css/clean.css' %}">
</head>
<body class="auth-page">

  <div class="auth-logo"><a href="/" style="text-decoration:none;color:inherit;">Comm<span>LTD</span></a></div>

  <div class="auth-card">
    <div class="card">
      <h1 class="auth-title">Check your email</h1>
      <p class="auth-subtitle">Enter the 6-digit code we sent to your email address. The code expires in 5 minutes.</p>

      {% if success %}
        <div class="alert alert--success" role="alert">{{ success }}</div>
      {% elif error %}
        <div class="alert alert--error" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="">
        {% csrf_token %}
        <div class="field">
          <label class="label" for="verification_code">Verification Code</label>
          <input class="input mono" type="password" id="verification_code" name="verification_code"
                 placeholder="••••••" maxlength="6" required autocomplete="one-time-code"
                 style="letter-spacing:.25em; font-size:1.25rem; text-align:center;">
        </div>
        <button type="submit" class="btn btn--primary btn--full">Verify Code</button>
      </form>

      <div class="mt-16 text-center">
        <p class="text-sm text-muted">Didn't receive a code? <a href="{% url 'forgot_password' %}">Try again</a></p>
      </div>
    </div>
  </div>

</body>
</html>
