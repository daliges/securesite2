{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Communication_LTD</title>
  <link rel="stylesheet" href="{% static 'css/clean.css' %}">
</head>
<body class="auth-page">

  <div class="auth-logo"><a href="/" style="text-decoration:none;color:inherit;">Comm<span>LTD</span></a></div>

  <div class="auth-card">
    <div class="card">
      <h1 class="auth-title">Forgot password?</h1>
      <p class="auth-subtitle">Enter your email and we'll send you a 6-digit verification code.</p>

      {% if success %}
        <div class="alert alert--success" role="alert">{{ success }}</div>
      {% elif error %}
        <div class="alert alert--error" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="">
        {% csrf_token %}
        <div class="field">
          <label class="label" for="email">Email address</label>
          <input class="input" type="email" id="email" name="email"
                 placeholder="you@example.com" required autocomplete="email">
        </div>
        <button type="submit" class="btn btn--primary btn--full">Send Verification Code</button>
      </form>

      <div class="mt-16 text-center">
        <a href="{% url 'login' %}" class="text-sm">&#8592; Back to Login</a>
      </div>
    </div>

    <p class="auth-footer-text">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
  </div>

</body>
</html>
