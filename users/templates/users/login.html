{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Communication_LTD</title>
  <link rel="stylesheet" href="{% static 'css/clean.css' %}">
</head>
<body class="auth-page">

  <div class="auth-logo"><a href="/" style="text-decoration:none;color:inherit;">Comm<span>LTD</span></a></div>

  <div class="auth-card">
    <div class="card">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your employee account.</p>

      {% if error %}
        <div class="alert alert--error" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="field">
          <label class="label" for="username">Username</label>
          <input class="input" type="text" id="username" name="username"
                 placeholder="Enter your username"
                 value="{{ username|default:'' }}" required autocomplete="username">
        </div>

        <div class="field">
          <label class="label" for="password">Password</label>
          <div class="input-wrap">
            <input class="input" type="password" id="password" name="password"
                   placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="input-toggle" onclick="togglePassword('password')" aria-label="Toggle password visibility">&#128065;</button>
          </div>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="remember_me" name="remember_me">
          <label for="remember_me">Remember me for 2 weeks</label>
        </div>

        <button type="submit" class="btn btn--primary btn--full">Log In</button>
      </form>

      <div class="mt-16 text-center">
        <a href="{% url 'forgot_password' %}" class="text-sm">Forgot your password?</a>
      </div>
    </div>

    <p class="auth-footer-text">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
  </div>

  <script>
    function togglePassword(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }
  </script>

</body>
</html>
