{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Successful — Communication_LTD</title>
  <link rel="stylesheet" href="{% static 'css/clean.css' %}">
  <style>
    .success-icon {
      width: 56px; height: 56px;
      background: #F0FDF4;
      border: 1px solid #BBF7D0;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      margin: 0 auto 20px;
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-logo"><a href="/" style="text-decoration:none;color:inherit;">Comm<span>LTD</span></a></div>

  <div class="auth-card">
    <div class="card" style="text-align:center;">
      <div class="success-icon">✓</div>
      <h1 class="auth-title" style="margin-bottom:8px;">Account created</h1>
      <p class="auth-subtitle" style="margin-bottom:32px;">Your registration was successful. You can now log in to access the employee portal.</p>
      <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
        <a href="{% url 'login' %}" class="btn btn--primary">Go to Login</a>
        <a href="/" class="btn btn--outline">Homepage</a>
      </div>
    </div>
  </div>

</body>
</html>
