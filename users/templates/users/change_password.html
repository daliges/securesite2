{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — Communication_LTD</title>
  <link rel="stylesheet" href="{% static 'css/clean.css' %}">
  <script src="{% static 'js/password_strength.js' %}?v=3" defer></script>
</head>
<body class="auth-page">

  <div class="auth-logo"><a href="/" style="text-decoration:none;color:inherit;">Comm<span>LTD</span></a></div>

  <div class="auth-card">
    <div class="card">
      <h1 class="auth-title">Change password</h1>
      <p class="auth-subtitle">Verify your identity and set a new password.</p>

      {% if errors %}
        <div class="alert alert--error" role="alert">
          <ul>
            {% for error in errors %}
              <li>{{ error }}</li>
            {% endfor %}
          </ul>
        </div>
      {% endif %}

      <form method="post" action="">
        {% csrf_token %}

        <div class="field">
          <label class="label" for="username">Username</label>
          <input class="input" type="text" id="username" name="username"
                 placeholder="Your username"
                 value="{{ username|default:'' }}" required autocomplete="username">
        </div>

        <div class="field">
          <label class="label" for="current_password">Current Password</label>
          <div class="input-wrap">
            <input class="input" type="password" id="current_password" name="current_password"
                   placeholder="Your current password" required autocomplete="current-password">
            <button type="button" class="input-toggle" onclick="togglePassword('current_password')" aria-label="Toggle">&#128065;</button>
          </div>
        </div>

        <div class="field">
          <label class="label" for="new_password">New Password</label>
          <div class="input-wrap">
            <input class="input" type="password" id="new_password" name="new_password"
                   placeholder="Choose a new password" required autocomplete="new-password">
            <button type="button" class="input-toggle" onclick="togglePassword('new_password')" aria-label="Toggle">&#128065;</button>
          </div>
          <progress id="password-strength-bar" class="strength-bar" value="0" max="5"></progress>
          <ul id="password-feedback" class="strength-feedback"></ul>
        </div>

        <div class="field">
          <label class="label" for="retype_new_password">Confirm New Password</label>
          <div class="input-wrap">
            <input class="input" type="password" id="retype_new_password" name="retype_new_password"
                   placeholder="Repeat your new password" required autocomplete="new-password">
            <button type="button" class="input-toggle" onclick="togglePassword('retype_new_password')" aria-label="Toggle">&#128065;</button>
          </div>
        </div>

        <button type="submit" class="btn btn--primary btn--full">Update Password</button>
      </form>

      <div class="mt-16 text-center">
        <a href="{% url 'login' %}" class="text-sm">&#8592; Back to Login</a>
      </div>
    </div>
  </div>

  <script>
    function togglePassword(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }
  </script>

</body>
</html>
