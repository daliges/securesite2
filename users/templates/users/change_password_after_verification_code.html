{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Communication_LTD</title>
  <link rel="stylesheet" href="{% static 'css/clean.css' %}">
  <script src="{% static 'js/password_strength.js' %}?v=3" defer></script>
</head>
<body class="auth-page">

  <div class="auth-logo"><a href="/" style="text-decoration:none;color:inherit;">Comm<span>LTD</span></a></div>

  <div class="auth-card">
    <div class="card">
      <h1 class="auth-title">Set new password</h1>
      <p class="auth-subtitle">Choose a strong new password for your account.</p>

      {% if errors %}
        <div class="alert alert--error" role="alert">
          <ul>
            {% for error in errors %}
              <li>{{ error }}</li>
            {% endfor %}
          </ul>
        </div>
      {% endif %}

      <form method="post" action="">
        {% csrf_token %}

        <div class="field">
          <label class="label" for="new_password">New Password</label>
          <div class="input-wrap">
            <input class="input" type="password" id="new_password" name="new_password"
                   placeholder="Choose a new password" required autocomplete="new-password">
            <button type="button" class="input-toggle" onclick="togglePassword('new_password')" aria-label="Toggle">&#128065;</button>
          </div>
          <progress id="password-strength-bar" class="strength-bar" value="0" max="5"></progress>
          <ul id="password-feedback" class="strength-feedback"></ul>
        </div>

        <div class="field">
          <label class="label" for="retype_new_password">Confirm New Password</label>
          <div class="input-wrap">
            <input class="input" type="password" id="retype_new_password" name="retype_new_password"
                   placeholder="Repeat your new password" required autocomplete="new-password">
            <button type="button" class="input-toggle" onclick="togglePassword('retype_new_password')" aria-label="Toggle">&#128065;</button>
          </div>
        </div>

        <button type="submit" class="btn btn--primary btn--full">Reset Password</button>
      </form>
    </div>
  </div>

</body>
</html>
